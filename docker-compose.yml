# =============================================================================
# MarketLens — Local development stack
# =============================================================================
# Brings up:
#   - the API on http://localhost:8000
#   - Redis (for caching + rate limiting + pub/sub + the RQ background job queue)
#   - a background worker (RQ) — processes AI analysis jobs (POST /api/ai/jobs)
#     and ticker backfill (adding a symbol to a watchlist). Without it, both
#     of those just enqueue a Redis job that nothing ever consumes (found via
#     a 2026-09-08 completeness audit — this file previously had no worker
#     service at all, so `docker compose up` alone left every backfill and AI
#     job permanently stuck at "queued").
#   - Jaeger (for distributed tracing; export at 16686)
#
# Usage:
#   docker compose up --build
#   docker compose up --build --scale worker=2   # more backfill throughput
#   docker compose down -v   # tear down including volumes
# =============================================================================

version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketlens-api
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: "sqlite:///./data/marketlens.db"
      # Redis (caching + rate limiting + pub/sub)
      REDIS_ENABLED: "true"
      REDIS_URL: "redis://redis:6379/0"
      # Observability — point OTLP at Jaeger
      OBSERVABILITY_TRACING_ENABLED: "true"
      OBSERVABILITY_JAEGER_AGENT_HOST: "jaeger"
      OBSERVABILITY_JAEGER_AGENT_PORT: "4317"
      OBSERVABILITY_METRICS_ENABLED: "true"
      OBSERVABILITY_STRUCTURED_LOGGING_ENABLED: "true"
      # AI / Market data / CORS
      AI_ENABLED: "false"
      MARKET_DATA_PRIMARY_PROVIDER: "yahoo_finance"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5001"
      # Run as a non-privileged port inside the container; we map 8000:8000.
      HOST: "0.0.0.0"
      PORT: "8000"
    volumes:
      # Persist the SQLite database across container restarts.
      - marketlens-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # No container_name — omitted so `--scale worker=N` can run more than
    # one instance (compose refuses to scale a service with a fixed name).
    # --worker-class rq.worker.SimpleWorker: RQ's default Worker forks a
    # child process per job, and this project's webull provider SDK
    # reproducibly segfaults the forked child (confirmed live, 2026-09-08:
    # "Work-horse terminated unexpectedly; waitpid returned 11 (signal 11)"
    # on the very first real job) — see backend/workers/backfill_worker.py's
    # module docstring. SimpleWorker runs jobs in-process instead, which
    # sidesteps it. One process listens to both queues (AI jobs +
    # backfill); scale the whole service via --scale if you need more
    # concurrent backfill throughput rather than splitting queues further.
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "--worker-class", "rq.worker.SimpleWorker", "marketlens-workers", "marketlens-backfill"]
    environment:
      DATABASE_URL: "sqlite:///./data/marketlens.db"
      REDIS_ENABLED: "true"
      REDIS_URL: "redis://redis:6379/0"
      AI_ENABLED: "false"
      MARKET_DATA_PRIMARY_PROVIDER: "yahoo_finance"
    volumes:
      - marketlens-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: marketlens-redis
    # Default port; explicitly bound so docker-compose networking is stable.
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: marketlens-jaeger
    environment:
      # Collector receives from the API's OTLP gRPC exporter.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector (HTTP)
      - "6831:6831/udp"  # Jaeger agent (compact thrift)
      - "6832:6832/udp"  # Jaeger agent (binary thrift)
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    restart: unless-stopped

volumes:
  marketlens-data:
    name: marketlens-data
  redis-data:
    name: marketlens-redis-data

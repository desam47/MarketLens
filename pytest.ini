[pytest]
# Project-root pytest config. Two pieces of path setup are needed:
#
#   - testroot = .  so `pytest` can be run from the repo root and discover
#     the `backend.tests` package.
#   - pythonpath adds both the repo root (so `from backend.X import Y`
#     works) and the `backend/` directory itself (so older tests that
#     use `sys.path.insert(0, 'backend/')` still resolve their bare
#     `from models.X` imports — they shouldn't, but we don't want to
#     change every test file just to fix a CI environment).
#
# Without these, `pytest backend/tests` from the repo root fails on
# collection with `ModuleNotFoundError: No module named 'backend'`.
testpaths = backend/tests
pythonpath = . backend

# Default test discovery pattern matches the run_tests.py runner
# (test_*.py) so both invocations pick up the same files.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output: one line per test, like the unittest TextTestRunner that
# run_tests.py uses. Keeps CI logs readable when the suite grows.
addopts = -ra --tb=short

# Warnings: don't fail on deprecation warnings from third-party deps
# (e.g. fastapi's httpx deprecation, curl_cffi). Surface them but don't
# break the build.
filterwarnings =
    default
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

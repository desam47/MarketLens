# Alembic configuration for MarketLens.
#
# The DB URL is intentionally left blank here — it is supplied at
# runtime by ``alembic/env.py`` which reads it from the project's
# settings (the same place FastAPI and the rest of the app read it
# from). Setting it here would risk a stale URL in version control.
#
# Standard Alembic tunables follow. They are not customised for
# MarketLens — the defaults work.

[alembic]
# Path to the migration scripts directory.
script_location = alembic

# Revision file template (a single string with ``%`` placeholders).
# Default is sufficient — we want one file per migration.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for create_date / modify_date columns.
timezone = UTC

# Maximum length of the slug in revision filenames.
truncate_slug_length = 40

# Set to "true" to allow `.py` scripts to be loaded without a
# `script.py.mako` template (we keep the template).
sourceless = false

# Output path for the version file when running `alembic version`.
version_path_separator = os

# Leave blank — supplied at runtime by env.py.
sqlalchemy.url =

[post_write_hooks]

# Format generated Python with ruff on `alembic revision` (no-op if
# ruff isn't on the path). The hooks default to disabled; uncomment
# if you want auto-formatting.
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

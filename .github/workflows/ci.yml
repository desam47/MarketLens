name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs when a new commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Lint + format check
  # ------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9

      - name: Ruff (lint)
        # `--exit-non-zero-on-fix` would fail the run if anything needed
        # formatting; we keep that to format-only and run lint without it.
        run: ruff check backend/ scripts/

      - name: Ruff (format check)
        run: ruff format --check backend/ scripts/

  # ------------------------------------------------------------------
  # Type check (advisory — not blocking)
  # ------------------------------------------------------------------
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install mypy==1.11.2 types-requests

      - name: mypy
        # Continue-on-error: mypy is advisory. The actual gate is tests.
        continue-on-error: true
        run: |
          mypy backend/ --no-incremental --follow-imports=silent

  # ------------------------------------------------------------------
  # Test suite
  # ------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt || true

      - name: Run tests
        env:
          # Disable Redis in default tests so the suite passes even if
          # the service container isn't reachable. The RedisCache tests
          # use mocks and don't need a live server.
          REDIS_ENABLED: "false"
          OBSERVABILITY_TRACING_ENABLED: "false"
        run: |
          python -m pytest backend/tests/ -v --tb=short

  # ------------------------------------------------------------------
  # Docker build smoke test
  # ------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        # We only build — no push. A failing build is a red flag.
        run: docker build -t marketlens:ci .
